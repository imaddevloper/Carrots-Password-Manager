name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable Libre APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Debug variants are signed automatically by Android Gradle Plugin.
      # The Libre Release variant is unsigned unless a release signing key is configured.
      - name: Build signed debug APK
        run: ./gradlew --no-daemon --stacktrace assembleLibreDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carrots-Password-Manager-Libre-APK
          path: app/build/outputs/apk/libre/debug/*.apk
          if-no-files-found: error
          retention-days: 14
